services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: whatsapp_grok
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - whatsapp_grok_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_grok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  whatsapp_grok_data:
