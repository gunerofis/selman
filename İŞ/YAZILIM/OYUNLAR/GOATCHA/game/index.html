<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Goatcha!</title>
  <script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --accent: #b06bff;       /* Stil B mor */
      --accent-2: #ffd24d;     /* altın */
      --ink: #1d1430;
      --panel: rgba(28, 18, 48, 0.92);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #2b2f33;
      font-family: system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #game {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      image-rendering: auto;
      background: #bfe9d0;
      display: block;
    }

    /* Dokunmatik kontroller — sadece dokunmatik cihazda + oyun aktifken */
    #touch-controls {
      position: fixed; inset: 0;
      pointer-events: none;
      display: none;
    }
    body.in-game #touch-controls { display: block; }
    body:not(.in-game) #touch-controls { display: none !important; }
    .touch-btn {
      position: absolute;
      pointer-events: auto;
      width: 84px; height: 84px;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      border: 3px solid rgba(255,255,255,0.55);
      color: #143;
      font-size: 34px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      bottom: 28px;
      backdrop-filter: blur(2px);
    }
    .touch-btn:active { background: rgba(255,255,255,0.5); }
    #btn-left  { left: 24px; }
    #btn-right { left: 128px; }
    #btn-jump  { right: 32px; width: 100px; height: 100px; font-size: 30px; }
    @media (pointer: coarse) {
      /* görünürlüğü body.in-game kontrol eder */
    }

    /* Üst-sağ küçük yuvarlak butonlar (mute + pause) — sadece oyunda */
    .corner-btn {
      position: fixed;
      width: 40px; height: 40px;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: #fff; font-size: 18px;
      cursor: pointer; z-index: 10;
      display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(2px);
      -webkit-tap-highlight-color: transparent;
    }
    body.in-game .corner-btn { display: flex; }
    .corner-btn:hover { background: rgba(0,0,0,0.55); }
    #btn-mute  { top: 10px; right: 10px; }
    #btn-pause { top: 10px; right: 58px; font-size: 16px; }

    /* ─── Menü Overlay ─── */
    #overlay {
      position: fixed; inset: 0; z-index: 50;
      display: none;
      align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 50% 30%, rgba(60,30,100,0.55), rgba(10,6,20,0.82));
      backdrop-filter: blur(3px);
    }
    #overlay.show { display: flex; }
    .screen {
      display: none;
      width: min(92vw, 460px);
      max-height: 92vh; overflow: auto;
      background: var(--panel);
      border: 1px solid rgba(176,107,255,0.4);
      border-radius: 20px;
      padding: 28px 26px 30px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.5);
      color: #f3eefe;
    }
    .screen.active { display: block; }
    .logo {
      font-size: clamp(40px, 11vw, 64px);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,0.25));
    }
    .tagline { margin: 6px 0 22px; opacity: 0.8; font-size: 15px; }
    .screen h2 { font-size: 26px; margin-bottom: 18px; color: var(--accent-2); }
    .screen h1 { font-size: clamp(34px, 9vw, 50px); margin-bottom: 14px; color: var(--accent-2); }
    .menu { display: flex; flex-direction: column; gap: 11px; margin-top: 8px; }
    .menu button, .back, .ok-btn {
      font: inherit; font-size: 18px; font-weight: 700;
      padding: 13px 18px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, #6b3fb0, #4a2a80);
      color: #fff; transition: transform .06s ease, filter .15s ease;
    }
    .menu button:hover, .back:hover, .ok-btn:hover { filter: brightness(1.15); }
    .menu button:active, .back:active, .ok-btn:active { transform: translateY(1px) scale(0.99); }
    .menu button.primary { background: linear-gradient(180deg, var(--accent-2), #e0a400); color: var(--ink); }
    .menu button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
    .back { margin-top: 18px; background: rgba(255,255,255,0.08); }

    /* Seviye seçim ızgarası */
    .level-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .level-grid button {
      font: inherit; font-weight: 800; font-size: 18px;
      aspect-ratio: 1; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.16);
      background: linear-gradient(180deg, #5a3a96, #3c2668);
      color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      position: relative;
    }
    .level-grid button .lvl-best { font-size: 10px; opacity: 0.7; font-weight: 600; }
    .level-grid button.locked { opacity: 0.35; cursor: not-allowed; }
    .level-grid button.locked::after { content: '🔒'; position: absolute; font-size: 14px; }
    .level-grid button.locked span { visibility: hidden; }

    /* Ayarlar */
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; padding: 12px 4px; font-size: 16px;
    }
    .setting-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .setting-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
    #alldone-stats { margin: 6px 0 18px; font-size: 17px; line-height: 1.7; opacity: 0.92; }
    #alldone-stats b { color: var(--accent-2); }
    .hint { margin-top: 12px; font-size: 14px; opacity: 0.7; font-style: italic; }
    .danger { background: rgba(255,90,90,0.16) !important; border-color: rgba(255,120,120,0.4) !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>

  <button id="btn-mute" class="corner-btn" aria-label="Ses aç/kapa">🔊</button>
  <button id="btn-pause" class="corner-btn" aria-label="Duraklat">⏸</button>

  <div id="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
    <div class="touch-btn" id="btn-jump">⤒</div>
  </div>

  <!-- ─── Menü Overlay (S10) ─── -->
  <div id="overlay">
    <!-- Başlık / Ana Menü -->
    <div class="screen" id="screen-title">
      <div class="logo">Goatcha!</div>
      <div class="tagline">Gördüğüne güvenme.</div>
      <div class="menu">
        <button id="mb-continue" class="primary">Devam Et</button>
        <button id="mb-new">Yeni Oyun</button>
        <button id="mb-select">Seviye Seç</button>
        <button id="mb-settings">Ayarlar</button>
      </div>
    </div>

    <!-- Seviye Seçimi -->
    <div class="screen" id="screen-select">
      <h2>Seviye Seç</h2>
      <div class="level-grid" id="level-grid"></div>
      <button class="back" id="sel-back">‹ Geri</button>
    </div>

    <!-- Duraklatma -->
    <div class="screen" id="screen-pause">
      <h2>Duraklatıldı</h2>
      <div class="menu">
        <button id="pm-resume" class="primary">Devam</button>
        <button id="pm-restart">Seviyeyi Yeniden Başlat</button>
        <button id="pm-settings">Ayarlar</button>
        <button id="pm-menu">Ana Menü</button>
      </div>
    </div>

    <!-- Ayarlar -->
    <div class="screen" id="screen-settings">
      <h2>Ayarlar</h2>
      <div class="setting-row">
        <span>🔊 Ses</span>
        <input type="range" id="set-volume" min="0" max="100" value="100" />
      </div>
      <div class="setting-row">
        <span>🔇 Sessiz</span>
        <input type="checkbox" id="set-mute" />
      </div>
      <div class="setting-row">
        <span>İlerlemeyi sıfırla</span>
        <button id="set-reset" class="back danger" style="margin:0;padding:8px 14px;font-size:14px;">Sıfırla</button>
      </div>
      <button class="back" id="set-back">‹ Geri</button>
    </div>

    <!-- Oyun Bitti -->
    <div class="screen" id="screen-alldone">
      <h1>🎉 Tebrikler!</h1>
      <div id="alldone-stats"></div>
      <div class="menu">
        <button id="ad-replay" class="primary">Tekrar Oyna</button>
        <button id="ad-select">Seviye Seç</button>
        <button id="ad-menu">Ana Menü</button>
      </div>
    </div>

    <!-- Nasıl Oynanır (ilk açılış, bir kez) -->
    <div class="screen" id="screen-howto">
      <h2>Nasıl Oynanır</h2>
      <p style="line-height:1.8;font-size:16px;">
        <b>← →</b> veya <b>A / D</b> ile yürü<br />
        <b>Boşluk</b> / <b>W</b> / <b>↑</b> ile zıpla<br />
        Dokunmatik butonlar &amp; gamepad de çalışır
      </p>
      <p class="hint">Bu dünya hile yapar. Masum görünen her şey bir tuzak olabilir.</p>
      <button id="howto-ok" class="ok-btn" style="margin-top:18px;">Anladım, başla!</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
