<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Goatcha!</title>
  <script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #2b2f33;
      font-family: system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #game {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      image-rendering: auto;
      background: #bfe9d0;
      display: block;
    }
    /* Dokunmatik kontroller — sadece dokunmatik cihazda görünür */
    #touch-controls {
      position: fixed; inset: 0;
      pointer-events: none;
      display: none;
    }
    .touch-btn {
      position: absolute;
      pointer-events: auto;
      width: 84px; height: 84px;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      border: 3px solid rgba(255,255,255,0.55);
      color: #143;
      font-size: 34px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      bottom: 28px;
      backdrop-filter: blur(2px);
    }
    .touch-btn:active { background: rgba(255,255,255,0.5); }
    #btn-left  { left: 24px; }
    #btn-right { left: 128px; }
    #btn-jump  { right: 32px; width: 100px; height: 100px; font-size: 30px; }

    /* Mute butonu */
    #btn-mute {
      position: fixed;
      top: 44px; right: 10px;
      width: 40px; height: 40px;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      backdrop-filter: blur(2px);
      -webkit-tap-highlight-color: transparent;
    }
    #btn-mute:hover { background: rgba(0,0,0,0.5); }

    /* Kaba "dokunmatik" tespiti: ince işaretçi yoksa göster */
    @media (pointer: coarse) {
      #touch-controls { display: block; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>

  <button id="btn-mute" aria-label="Ses aç/kapa">🔊</button>

  <div id="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
    <div class="touch-btn" id="btn-jump">⤒</div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    // Mute butonu — audio.js modülüne erişim main.js üzerinden
    document.getElementById('btn-mute').addEventListener('click', function() {
      // main.js'teki audio modülünü window üzerinden tetikle
      window.dispatchEvent(new CustomEvent('toggle-mute'));
    });
  </script>
</body>
</html>
