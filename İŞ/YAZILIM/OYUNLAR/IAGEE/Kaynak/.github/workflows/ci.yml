name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (ci)
        run: npm ci

      - name: Test (e2e smoke)
        run: npm test
        env:
          SMOKE_PORT: "18765"
