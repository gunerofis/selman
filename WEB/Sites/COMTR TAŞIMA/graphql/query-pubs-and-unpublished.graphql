query PubsAndUnpublished {
  publications(first: 20) {
    nodes { id name }
  }
  collection(id: "gid://shopify/Collection/660811153700") {
    productsCount { count }
    products(first: 250) {
      nodes {
        id
        handle
        status
        publishedOnCurrentPublication
      }
    }
  }
}
