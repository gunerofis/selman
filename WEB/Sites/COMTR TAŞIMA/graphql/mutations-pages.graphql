      title: "Hakkımızda ve Üretim"
      body: "<p>Sümen Takımı TR, Güner Ofis üretimi masaüstü ofis ürünlerini satar. Mağaza adı Sümen Takımı TR; üretici Güner Ofis’tir.</p><h2>Üretim yapısı</h2><ul><li>MDF işleme</li><li>Deri kaplama</li><li>Ahşap uygulama</li><li>Kişiselleştirme</li><li>Seri ve kurumsal üretim</li></ul><h2>Adresler</h2><p><strong>Üretim (Gebze):</strong> Arapçeşme Mah. 1038. Sok. No:32/A, Gebze / Kocaeli</p><p><strong>Depo (İstanbul):</strong> Onur Sokak No:8, 34445 İstanbul</p><p>Telefon: 0501 144 27 29<br>E-posta: info@sumentakimi.com.tr</p><p>Kargo her iki noktadan da çıkabilir.</p>"
    }
