mutation UpdatePagesAndRehber {
  rehber: pageUpdate(
    id: "gid://shopify/Page/166741475620"
    page: {
      title: "Sümen Takımı Rehberi"
      handle: "sumen-takimi-rehberi"
      redirectNewHandle: true
      templateSuffix: ""
      isPublished: true
      body: "<p>Sümen takımı rehberi satış kategorisi değildir. Türler, ölçüler, parça sayıları ve bakım için bilgilendirme merkezidir.</p><h2>Sümen takımı nedir?</h2><p>Sümen takımı; yazı altlığı, kalemlik, evraklık, isimlik ve tamamlayıcı masa parçalarından oluşan masaüstü ofis setidir. Amaç, masadaki günlük araçları aynı malzeme ve düzende tutmaktır.</p><h2>Hangi parçalardan oluşur?</h2><p>Tipik setlerde sümen, kalemlik, evrak rafı, notluk, isimlik ve bazen telefon standı veya masa bayrağı bulunur. 9, 10, 11 ve 12 parça modeller bu içeriğe göre ayrılır.</p><h2>Deri, ahşap ve kristal farkları</h2><p>Deri setler günlük ofis kullanımına; kristal setler daha sabit ve temsili masa düzenine; ahşap detaylı modeller ise malzeme karakterine göre seçilir. Karşılaştırma için <a href=\"/blogs/news/deri-ve-kristal-sumen-takimi-arasindaki-farklar\">deri ve kristal farkları</a> yazısına bakın.</p><h2>9, 10, 11 ve 12 parça karşılaştırması</h2><p>Dar masalarda 9–10 parça; geniş yönetici masalarında 11–12 parça daha dengeli durur. Masa bayraklı ve full setler ayrı üründür.</p><h2>Masa ölçüsüne göre seçim</h2><p>Sümenin yerleşeceği alanı ölçün. Klavye, ekran ve sık kullanılan eşyalar için boşluk bırakın.</p><h2>Yönetici masası ve ev ofis</h2><p>Yönetici masasında lüks ve çok parçalı setler; ev ofiste daha az parçalı deri setler öne çıkar.</p><h2>Renk seçimi</h2><p>Siyah, kahve, taba ve bordo en sık kullanılan ana renklerdir. Aksesuar rengi gold veya gümüş olabilir.</p><h2>Kişiselleştirme</h2><p>İsimlik ve logo uygulaması uygun ürünlerde yapılır. Sipariş için <a href=\"/pages/bize-ulasin\">iletişim</a> sayfasını kullanın.</p><h2>Bakım ve temizlik</h2><p>Deri yüzeyler nemli yumuşak bezle silinir. Kristal parçalarda aşındırıcı malzeme kullanılmaz.</p><h2>İlgili koleksiyonlar</h2><ul><li><a href=\"/collections/sumen-takimi\">Tüm sümen takımları</a></li><li><a href=\"/collections/deri-sumen-takimlari\">Deri sümen takımları</a></li><li><a href=\"/collections/luks-sumen-takimlari\">Lüks sümen takımları</a></li><li><a href=\"/collections/kristal-sumen-takimlari\">Kristal sümen takımları</a></li><li><a href=\"/collections/masa-ustu-isimlikler\">Masa üstü isimlikler</a></li></ul><h2>İlgili rehber yazıları</h2><ul><li><a href=\"/blogs/news/sumen-takimi-secerken-nelere-dikkat-edilmeli\">Sümen takımı seçerken nelere dikkat edilmeli?</a></li><li><a href=\"/blogs/news/deri-ve-kristal-sumen-takimi-arasindaki-farklar\">Deri ve kristal sümen takımı arasındaki farklar</a></li><li><a href=\"/blogs/news/kisiye-ozel-masa-isimligi-siparis-rehberi\">Kişiye özel masa isimliği sipariş rehberi</a></li><li><a href=\"/blogs/news/ofis-masasinda-duzen-kurmanin-7-pratik-yolu\">Ofis masasında düzen kurmanın 7 pratik yolu</a></li></ul>"
    }
  ) {
    page { id handle title }
    userErrors { field message }
  }
  about: pageUpdate(
    id: "gid://shopify/Page/166761464100"
