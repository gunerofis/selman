    page: {
      body: "<h2>1. Taraflar</h2><h3>1.1. Satıcı</h3><p><strong>Unvan:</strong> Makro Ofis<br><strong>Mağaza adı:</strong> Sümen Takımı<br><strong>Üretici:</strong> Makro Ofis<br><strong>Adres:</strong> Arapçeşme Mah. 1038. Sok. No:32/A, Gebze / Kocaeli<br><strong>Depo / sevkiyat:</strong> Onur Sokak No:8, 34445 İstanbul<br><strong>E-posta:</strong> info@sumentakimi.com.tr<br><strong>Telefon:</strong> 0501 144 27 29</p><h3>1.2. Alıcı</h3><p>Alıcı, sumentakimi.com.tr üzerinden sipariş veren kişidir. Sipariş sırasında Alıcı tarafından bildirilen ad, adres ve iletişim bilgileri esas alınır.</p><h2>2. Sözleşmenin Konusu</h2><p>Bu sözleşme, Alıcı'nın sumentakimi.com.tr üzerinden sipariş verdiği ürünün satışı ve teslimine ilişkin tarafların hak ve yükümlülüklerinin belirlenmesi amacıyla düzenlenmiştir.</p><h2>3. Sipariş Bilgileri</h2><p>Ürün, adet, satış bedeli, ödeme, teslimat ve varsa kişiselleştirme bilgileri sipariş özeti ile ödeme adımında Alıcı'ya gösterilir. Sevkiyat Gebze veya İstanbul deposundan yapılabilir.</p>"
    }
